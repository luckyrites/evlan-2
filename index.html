<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elvan Foods | 7 Master Brands • 47 Products • 33 SKUs FMCG Manufacturer</title>
  
  <meta name="description" content="Elvan Foods: Leading food products manufacturer. Featuring Crimson™ Sauces, Spice Dragon™ Chinese, Raghunandan™ Pickles, Hridaya Ram™ Namkeen, Farm Feast™ Frozen & Pasta, Nandan™ Jams, and Ambar Masale™ Pastes." />
  
  <!-- Favicon with Elvan Brand Motif -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23B31329'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23E84E1B' opacity='0.8'/%3E%3Ctext x='16' y='21' font-family='serif' font-size='15' font-weight='900' fill='%23FFFFFF' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />

  <!-- Google Fonts for Editorial Luxury & Devanagari Scripts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;900&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN for reactive utility rendering -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            citrus: {
              100: '#ffeedf',
              200: '#fed7aa',
              400: '#f06838',
              500: '#E84E1B',
              600: '#cf3d0d',
              700: '#a82c06',
            },
            burgundy: {
              100: '#f7e8ea',
              700: '#762530',
              800: '#5c1c24',
              900: '#46151b',
              950: '#260a0e',
            },
            cream: {
              50: '#ffffff',
              100: '#fdfbf7',
              200: '#fbf7ee',
              300: '#f5eedf',
              400: '#ece1cc',
              500: '#ddccb0',
            },
            olive: {
              100: '#e5ede9',
              600: '#3a5e50',
              700: '#2d4a3e',
              800: '#21352c',
            },
            gold: '#c59b27',
            terracotta: '#c86446',
            earth: {
              DEFAULT: '#1e1b18',
              muted: '#6e675f',
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
            display: ['"Italiana"', '"Playfair Display"', 'Georgia', 'serif'],
            hindi: ['"Noto Sans Devanagari"', '"Rozha One"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Three.js CDN for 3D Product Interactive Experience -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Canvas Confetti for Celebration on Order Completion -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet with Luxury Editorial Touches -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-cream-200 text-earth font-sans selection:bg-citrus-500 selection:text-white antialiased">

  <!-- Sticky Glass Header -->
  <header id="main-header" class="sticky top-0 z-50 glass-header transition-all"></header>

  <!-- Main Content Layout -->
  <main>
    <!-- Hero Section -->
    <section id="hero-section" class="relative overflow-hidden"></section>

    <!-- 7 Flagship Master Brands Showcase -->
    <section id="brands-section"></section>

    <!-- Product Catalog & SKU Matrix (47 Products) -->
    <section id="pantry-section"></section>

    <!-- Sensory Tasting Wheel & Flavor Constellation -->
    <section id="tasting-section"></section>

    <!-- Packaging Capabilities & Formats (7g to 10kg) -->
    <section id="packaging-section"></section>

    <!-- Trade & Institutional Inquiry -->
    <section id="newsletter-section"></section>
  </main>

  <!-- Luxury Editorial Footer -->
  <footer id="main-footer"></footer>

  <!-- Slide-out Cart & Quote Drawer -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="cart-drawer" class="cart-drawer-panel">
    <div class="p-5 border-b border-cream-400 flex items-center justify-between bg-cream-50">
      <div class="flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-citrus-500"></span>
        <h3 class="font-serif font-bold text-lg text-burgundy-950">Elvan Foods Order & Quote</h3>
      </div>
      <button class="p-1.5 rounded-full text-earth-muted hover:text-citrus-600 transition-colors" onclick="window.app.closeCart()" title="Close Cart">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Reactive Dynamic Cart Content -->
    <div id="cart-drawer-content" class="flex-1 flex flex-col overflow-hidden"></div>
  </aside>

  <!-- Product Quick-View Modal -->
  <div id="product-modal" class="modal-container">
    <div class="modal-content-card max-w-4xl">
      <button id="modal-close-btn" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-cream-200 text-earth hover:text-citrus-600 flex items-center justify-center font-bold text-sm shadow-sm transition-colors" title="Close">
        ✕
      </button>
      <div id="modal-product-body"></div>
    </div>
  </div>

  <!-- Simulated Checkout / B2B Quote Modal -->
  <div id="checkout-modal" class="modal-container">
    <div class="modal-content-card max-w-xl">
      <button id="checkout-modal-close-btn" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-cream-200 text-earth hover:text-citrus-600 flex items-center justify-center font-bold text-sm shadow-sm transition-colors" title="Close">
        ✕
      </button>
      <div id="checkout-modal-content"></div>
    </div>
  </div>

  <!-- Toast Notice Element -->
  <div id="toast-notice" class="toast-notice"></div>

  <!-- Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
